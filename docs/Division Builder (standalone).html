document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\n@keyframes dbglow{0%,100%{box-shadow:0 0 0 2px rgba(47,158,99,0.9),0 0 10px 2px rgba(47,158,99,0.5)}50%{box-shadow:0 0 0 2px rgba(47,158,99,0.6),0 0 16px 4px rgba(47,158,99,0.35)}}\n.db-scroll::-webkit-scrollbar{width:8px}\n.db-scroll::-webkit-scrollbar-thumb{background:#bcae90;border-radius:4px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#2a241a;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.015) 0 8px,transparent 8px 16px);display:flex;flex-direction:column;align-items:center;padding:34px 30px;font-family:'IBM Plex Mono',monospace;color:#2b2b2b\">\n\n  <div style=\"width:1180px;max-width:100%;color:#cdc6b8;margin-bottom:14px;display:flex;align-items:baseline;gap:14px\">\n    <div style=\"font-family:'Caveat';font-weight:700;font-size:30px;color:#f0e8d6\">Division Builder<\u002Fdiv>\n    <div style=\"font-size:11px;color:#9a907c;letter-spacing:0.04em\">full-center overlay · hover = preview · click = place · drag-free<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:1180px;max-width:100%;height:720px;background:#efe9dc;border:2px solid #8a7038;border-radius:5px;box-shadow:0 16px 40px rgba(0,0,0,0.55);display:flex;flex-direction:column;overflow:hidden\">\n\n    <!-- panel header -->\n    <div style=\"height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1.5px solid #cbbfa6;background:#e9e1cf\">\n      <div style=\"font-family:'Zilla Slab';font-weight:700;font-size:19px;letter-spacing:0.02em\">DIVISION BUILDER<\u002Fdiv>\n      <div style=\"font-size:10px;color:#6b6258;border:1px solid #cbbfa6;border-radius:3px;padding:3px 9px;background:#efe9dc\">Template: <b>3rd Mechanized<\u002Fb><\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <sc-if value=\"{{ cellSelected }}\" hint-placeholder-val=\"{{ false }}\">\n        <div onclick=\"{{ deselect }}\" style=\"font-size:11px;color:#2f6fd6;border:1.5px solid #2f6fd6;border-radius:3px;padding:5px 12px;cursor:pointer;background:rgba(47,111,214,0.08)\">← Overview (deselect)<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"font-size:18px;color:#6b6258;cursor:pointer\">✕<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;min-height:0\">\n\n      <!-- ===== LEFT COLUMN — fixed grid ===== -->\n      <div style=\"flex:none;width:478px;border-right:1.5px solid #cbbfa6;display:flex;flex-direction:column;padding:18px 20px;background:#efe9dc\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n          <div style=\"font-size:10px;color:#6b6258;letter-spacing:0.06em\">TEMPLATE GRID · 5×5<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px;font-size:9px;color:#9a6a2e\"><span style=\"font-family:'Caveat';font-size:14px\">front-to-back ↓<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FRONT marker -->\n        <div style=\"display:flex;align-items:center;gap:8px;margin:2px 0 8px\">\n          <div style=\"width:78px\"><\u002Fdiv>\n          <div style=\"flex:1;height:0;border-top:2px solid #b5462e\"><\u002Fdiv>\n          <div style=\"font-size:9px;color:#b5462e;letter-spacing:0.1em;font-weight:600\">FRONT LINE<\u002Fdiv>\n          <div style=\"flex:1;height:0;border-top:2px solid #b5462e\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- rows -->\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <div style=\"width:78px;flex:none;text-align:right;padding-right:6px\">\n                <div style=\"font-family:'Zilla Slab';font-weight:600;font-size:12px;color:{{ row.accent }}\">{{ row.label }}<\u002Fdiv>\n                <div style=\"font-size:8px;color:#9a907c\">{{ row.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"5\">\n                  <div onclick=\"{{ cell.onClick }}\" style=\"{{ cell.style }}\">\n                    <sc-if value=\"{{ cell.filled }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"{{ cell.symStyle }}\"><\u002Fdiv>\n                      <div style=\"font-size:8px;font-weight:600;color:#241f17;margin-top:3px;letter-spacing:0.04em\">{{ cell.abbrev }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ cell.empty }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:16px;color:#c3b896;font-weight:300\">+<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ cell.showSel }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"position:absolute;inset:-3px;border:2px solid #12b5c2;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,0.5);pointer-events:none\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ cell.showGlow }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"position:absolute;inset:-3px;border-radius:4px;animation:dbglow 1.3s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n                      <div style=\"position:absolute;top:-9px;right:-6px;font-size:7px;background:#2f9e63;color:#fff;padding:1px 4px;border-radius:2px;letter-spacing:0.05em;pointer-events:none\">SYN<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:auto;padding-top:14px\">\n          <div style=\"display:flex;gap:14px;font-size:9px;color:#6b6258;margin-bottom:8px\">\n            <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:15px;height:15px;border:1.5px dashed #b3a988;border-radius:2px\"><\u002Fspan>Empty — partial fill is normal<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:15px;height:15px;border:2px solid #2f9e63;border-radius:2px\"><\u002Fspan>Live synergy glow<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Caveat';font-size:15px;color:#5f574b;line-height:1.25\">Most divisions never fill all 25 cells. Cells show icon + role glyph only — full stats live in the right column, never on the grid.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== RIGHT COLUMN — swaps by state ===== -->\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:#f3eee2\">\n\n        <!-- ---- OVERVIEW (no cell selected) ---- -->\n        <sc-if value=\"{{ showOverview }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1;display:flex;flex-direction:column;padding:20px 22px;gap:16px;overflow:hidden\">\n            <div style=\"font-family:'Zilla Slab';font-weight:700;font-size:16px;letter-spacing:0.02em\">DIVISION OVERVIEW<\u002Fdiv>\n\n            <!-- derived type -->\n            <div style=\"border:1.5px solid #cbbfa6;border-radius:4px;padding:14px 16px;background:#efe9dc\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><span style=\"font-size:9px;background:#241f17;color:#efe9dc;padding:2px 8px;border-radius:2px;letter-spacing:0.05em\">AUTO-DERIVED<\u002Fspan><span style=\"font-size:9px;color:#9a907c\">computed from composition — not chosen by you<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:18px\">\n                <div><div style=\"font-size:9px;color:#6b6258;margin-bottom:2px\">DIVISION TYPE<\u002Fdiv><div style=\"font-family:'Zilla Slab';font-weight:700;font-size:21px;color:#241f17\">{{ divType }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"border-left:1.5px solid #cbbfa6;padding-left:18px\"><div style=\"font-size:9px;color:#6b6258;margin-bottom:2px\">ENGAGEMENT RADIUS<\u002Fdiv><div style=\"font-family:'Zilla Slab';font-weight:700;font-size:21px;color:#241f17\">{{ engagement }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- movement profile -->\n            <div style=\"border:1.5px solid #cbbfa6;border-radius:4px;padding:14px 16px;background:#efe9dc\">\n              <div style=\"font-size:10px;color:#6b6258;letter-spacing:0.05em;margin-bottom:10px\">MOVEMENT PROFILE — passable → impassable for this composition<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:4px;margin-bottom:8px\">\n                <div style=\"width:42px;height:22px;background:#c9d6b0;border:1px solid #b3a988\"><\u002Fdiv>\n                <div style=\"width:42px;height:22px;background:#aebf8e;border:1px solid #b3a988\"><\u002Fdiv>\n                <div style=\"width:42px;height:22px;background:#7f9e6b;border:1px solid #b3a988\"><\u002Fdiv>\n                <div style=\"width:42px;height:22px;background:#566f49;border:1px solid #b3a988\"><\u002Fdiv>\n                <div style=\"width:42px;height:22px;background:repeating-linear-gradient(45deg,#241f17 0 1.5px,transparent 1.5px 5px);outline:1px solid #241f17\"><\u002Fdiv>\n                <div style=\"width:42px;height:22px;background:repeating-linear-gradient(45deg,#241f17 0 1.5px,transparent 1.5px 5px);outline:1px solid #241f17\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:9px;color:#6b6258\"><span>fast<\u002Fspan><span>slowest: <b style=\"color:#241f17\">{{ slowest }}<\u002Fb><\u002Fspan><span style=\"color:#9a6a2e\">impassable: <b>{{ impassable }}<\u002Fb><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- fill stats -->\n            <div style=\"border:1.5px solid #cbbfa6;border-radius:4px;padding:14px 16px;background:#efe9dc;flex:1;min-height:0\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px\">\n                <div style=\"font-size:10px;color:#6b6258;letter-spacing:0.05em\">FILL &amp; ROLE BALANCE<\u002Fdiv>\n                <div><span style=\"font-family:'Zilla Slab';font-weight:700;font-size:22px\">{{ fillCount }}<\u002Fspan><span style=\"font-size:12px;color:#6b6258\"> / 25 cells<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ roleBalance }}\" as=\"rb\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <div style=\"width:74px;font-size:10px;color:{{ rb.accent }};font-weight:600;text-align:right\">{{ rb.label }}<\u002Fdiv>\n                    <div style=\"flex:1;height:14px;background:#e0d8c4;border:1px solid #cbbfa6;border-radius:2px;overflow:hidden;display:flex\">\n                      <div style=\"height:100%;width:{{ rb.pct }};background:{{ rb.accent }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"width:30px;font-size:10px;color:#6b6258\">{{ rb.count }}/5<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'Caveat';font-size:16px;color:#5f574b;line-height:1.25\">Click any grid cell to choose a unit for it. Everything here is read-only — the engine derives type, radius and movement from what you place.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ---- CELL SELECTED (split: list + detail) ---- -->\n        <sc-if value=\"{{ cellSelected }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1;display:flex;flex-direction:column;min-height:0\">\n\n            <!-- context strip -->\n            <div style=\"flex:none;padding:14px 22px 10px;border-bottom:1.5px solid #cbbfa6;background:#f3eee2\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"font-size:9px;color:#fff;background:{{ selAccent }};padding:3px 9px;border-radius:2px;letter-spacing:0.04em;font-weight:600\">{{ selRole }}<\u002Fspan>\n                <div style=\"font-family:'Zilla Slab';font-weight:700;font-size:15px\">{{ selCoord }}<\u002Fdiv>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div style=\"font-size:9px;color:#6b6258;display:flex;gap:10px\"><span>hover = <b>preview<\u002Fb><\u002Fspan><span style=\"color:#2f9e63\">click = <b>place<\u002Fb><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- TOP: eligible list (scrollable) -->\n            <div class=\"db-scroll\" style=\"flex:1;min-height:0;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font-size:9px;color:#6b6258;letter-spacing:0.05em\">ELIGIBLE UNITS · {{ selRole }} ROW<\u002Fdiv>\n              <sc-for list=\"{{ eligible }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div onclick=\"{{ u.onClick }}\" onmouseenter=\"{{ u.onEnter }}\" onmouseleave=\"{{ u.onLeave }}\" style=\"{{ u.rowStyle }}\">\n                  <div style=\"{{ u.symStyle }}\"><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:'Zilla Slab';font-weight:600;font-size:14px\">{{ u.name }}<\u002Fspan><span style=\"font-size:8px;color:#6b6258;letter-spacing:0.06em\">{{ u.abbrev }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:10px;color:#6b6258;margin-top:1px\">{{ u.line }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;flex:none\">\n                    <div style=\"font-size:10px\"><span style=\"color:#6b6258\">{{ u.stat1k }} <\u002Fspan><b>{{ u.stat1v }}<\u002Fb><\u002Fdiv>\n                    <div style=\"font-size:10px\"><span style=\"color:#6b6258\">{{ u.stat2k }} <\u002Fspan><b>{{ u.stat2v }}<\u002Fb><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ u.placed }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"flex:none;font-size:8px;color:#2f9e63;border:1px solid #2f9e63;border-radius:2px;padding:2px 5px\">IN CELL<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-family:'Caveat';font-size:14px;color:#9a907c;margin-top:2px;line-height:1.2\">List stays put on click so you can keep comparing — placing never collapses it.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- BOTTOM: fixed detail callout -->\n            <div style=\"flex:none;border-top:2px solid #8a7038;background:#efe9dc;padding:14px 18px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px\">\n                <span style=\"font-size:9px;color:#6b6258;letter-spacing:0.05em\">DETAIL<\u002Fspan>\n                <sc-if value=\"{{ hasDetail }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-size:8px;color:#241f17;padding:1px 6px;border-radius:2px;background:{{ detailBadgeColor }}\">{{ detailBadge }}<\u002Fspan>\n                <\u002Fsc-if>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <sc-if value=\"{{ hasDetail }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"{{ detail.symStyle }}\"><\u002Fdiv>\n                  <div><div style=\"font-family:'Zilla Slab';font-weight:700;font-size:15px;line-height:1\">{{ detail.name }}<\u002Fdiv><div style=\"font-size:8px;color:#6b6258;text-align:right\">{{ detail.abbrev }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ noDetail }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1.5px dashed #cbbfa6;border-radius:4px;background:rgba(255,255,255,0.4)\">\n                  <div style=\"font-family:'Caveat';font-size:19px;color:#9a907c\">Empty cell — nothing placed yet<\u002Fdiv>\n                  <div style=\"font-size:10px;color:#a89a7e\">Hover a unit below to preview its card · click to place<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasDetail }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;gap:18px\">\n                <!-- stat grid -->\n                <div style=\"flex:none\">\n                  <div style=\"font-size:8px;color:#6b6258;margin-bottom:5px;letter-spacing:0.05em\">STATS<\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(5,46px);gap:6px\">\n                    <sc-for list=\"{{ detail.stats }}\" as=\"s\" hint-placeholder-count=\"5\">\n                      <div style=\"text-align:center\"><div style=\"font-family:'Zilla Slab';font-weight:700;font-size:15px\">{{ s.v }}<\u002Fdiv><div style=\"font-size:7px;color:#6b6258;letter-spacing:0.04em\">{{ s.k }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <!-- terrain + role + synergy -->\n                <div style=\"flex:1;min-width:0;border-left:1.5px solid #cbbfa6;padding-left:18px;display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"font-size:10px\"><span style=\"color:#6b6258\">Role · <\u002Fspan>{{ detail.line }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:14px;font-size:10px\">\n                    <span><span style=\"color:#2f9e63\">▲ good:<\u002Fspan> {{ detail.good }}<\u002Fspan>\n                    <span><span style=\"color:#9a6a2e\">▼ poor:<\u002Fspan> {{ detail.poor }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:10px;background:rgba(47,158,99,0.1);border:1px solid #a9cdb6;border-radius:3px;padding:6px 9px;color:#2c6b46\"><b>Synergy:<\u002Fb> {{ detail.syn }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:1180px;max-width:100%;margin-top:12px;font-family:'Caveat';font-size:16px;color:#a89a7e;line-height:1.3\">Wireframe is live: click cells, hover units to preview (watch synergy cells glow on the grid), click to place. “← Overview” returns to the no-selection state.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820}}\">\nclass Component extends DCLogic {\n  state = {\n    grid: { 0:'recon', 2:'recon', 5:'arm', 6:'arm', 7:'inf', 10:'art', 11:'at', 15:'inf', 20:'hq' },\n    sel: 5,         // selected cell index, or null — defaults to a FILLED cell (Armor)\n    detailId: 'arm',// explicit detail unit, or null = empty browse state\n    hoverId: null,  // active hover (for synergy glow), cleared on leave\n  };\n\n  CAT = {\n    inf:{name:'Infantry',abbrev:'INF',line:'Holds ground, cheap & resilient',stats:{Soft:24,Hard:6,Def:30,Brk:8,Arm:0},good:'Urban, Forest',poor:'Open plains',syn:'Anchors armor & artillery placed beside it'},\n    arm:{name:'Armor',abbrev:'ARM',line:'Breakthrough & exploitation',stats:{Soft:18,Hard:34,Def:16,Brk:42,Arm:80},good:'Plains',poor:'Mountain, Dense forest',syn:'Pairs with Mech / Infantry for combined-arms bonus'},\n    mech:{name:'Mechanized',abbrev:'MEC',line:'Mobile infantry, keeps pace with armor',stats:{Soft:20,Hard:14,Def:24,Brk:22,Arm:30},good:'Plains, Road',poor:'Mountain',syn:'Bridges armor and line infantry'},\n    recon:{name:'Recon',abbrev:'RCN',line:'Scouts ahead, widens engagement radius',stats:{Soft:8,Hard:4,Def:10,Brk:14,Arm:10},good:'All terrain',poor:'—',syn:'Feeds targeting to adjacent Armor & Artillery'},\n    art:{name:'Artillery',abbrev:'ART',line:'Indirect soft-attack from the rear',stats:{Soft:46,Hard:10,Def:8,Brk:6,Arm:0},good:'Any (rear)',poor:'Frontline',syn:'Wants Infantry / Recon spotting in front'},\n    at:{name:'Anti-tank',abbrev:'ATG',line:'Stops enemy armor cold',stats:{Soft:6,Hard:40,Def:14,Brk:4,Arm:0},good:'Defensive lines',poor:'Offense',syn:'Best beside Infantry holding the line'},\n    aa:{name:'Anti-air',abbrev:'AAA',line:'Denies enemy air over the stack',stats:{Soft:10,Hard:8,Def:12,Brk:2,Arm:0},good:'Rear, Hubs',poor:'—',syn:'Protects Artillery & HQ behind it'},\n    eng:{name:'Engineers',abbrev:'ENG',line:'River crossings, forts, clears terrain',stats:{Soft:12,Hard:8,Def:20,Brk:10,Arm:0},good:'Rivers, Urban',poor:'—',syn:'Enables Armor / Infantry across obstacles'},\n    spg:{name:'SP Gun',abbrev:'SPG',line:'Mobile artillery, shoots & scoots',stats:{Soft:38,Hard:16,Def:12,Brk:14,Arm:20},good:'Plains',poor:'Mountain',syn:'Mobile fire support for Armor / Infantry'},\n    hq:{name:'Command',abbrev:'HQ',line:'Coordination aura for the whole stack',stats:{Soft:4,Hard:2,Def:16,Brk:2,Arm:0},good:'Rear',poor:'Frontline',syn:'Lifts every adjacent unit'},\n  };\n  ROLES = [\n    {key:'van', label:'VANGUARD', sub:'screen / probe', accent:'#b5462e', elig:['recon','mech','arm']},\n    {key:'aslt',label:'ASSAULT',  sub:'punch through',  accent:'#c4632f', elig:['arm','mech','inf']},\n    {key:'supp',label:'SUPPORT',  sub:'enable & cover',  accent:'#c9982f', elig:['art','at','eng']},\n    {key:'resv',label:'RESERVE',  sub:'rotate / hold',   accent:'#6b8e4d', elig:['inf','mech','at']},\n    {key:'rear',label:'REAR',     sub:'fires & command', accent:'#4f7a93', elig:['art','spg','hq','aa']},\n  ];\n  SYN = {\n    inf:['arm','art','at','mech','spg'], arm:['inf','mech','recon','eng','spg'], mech:['arm','inf'],\n    recon:['arm','art'], art:['inf','recon'], at:['inf','mech'], aa:['art','hq'],\n    eng:['inf','arm'], spg:['inf','arm','art'], hq:['inf','arm','art','mech','recon','at','aa','eng','spg'],\n  };\n\n  symStyle(type, w, h) {\n    const G = {\n      inf:'linear-gradient(45deg,transparent 44%,#241f17 44%,#241f17 56%,transparent 56%),linear-gradient(135deg,transparent 44%,#241f17 44%,#241f17 56%,transparent 56%)',\n      arm:'radial-gradient(ellipse 58% 40% at 50% 50%,transparent 0 36%,#241f17 37% 52%,transparent 53%)',\n      mech:'linear-gradient(45deg,transparent 44%,#241f17 44%,#241f17 56%,transparent 56%),linear-gradient(135deg,transparent 44%,#241f17 44%,#241f17 56%,transparent 56%),linear-gradient(0deg,transparent 46%,#241f17 46%,#241f17 54%,transparent 54%)',\n      recon:'linear-gradient(135deg,transparent 44%,#241f17 44%,#241f17 56%,transparent 56%)',\n      art:'radial-gradient(circle at 50% 50%,#241f17 0 15%,transparent 16%)',\n      at:'linear-gradient(135deg,transparent 44%,#241f17 44%,#241f17 56%,transparent 56%),linear-gradient(0deg,transparent 62%,#241f17 62%,#241f17 72%,transparent 72%)',\n      aa:'linear-gradient(60deg,transparent 45%,#241f17 45%,#241f17 55%,transparent 55%),linear-gradient(-60deg,transparent 45%,#241f17 45%,#241f17 55%,transparent 55%)',\n      eng:'repeating-linear-gradient(45deg,#241f17 0 2px,transparent 2px 6px)',\n      spg:'radial-gradient(circle at 50% 50%,#241f17 0 13%,transparent 14%),linear-gradient(135deg,transparent 45%,#241f17 45%,#241f17 55%,transparent 55%)',\n      hq:'linear-gradient(90deg,#241f17 0 18%,transparent 18%),linear-gradient(0deg,transparent 28%,#241f17 28%,#241f17 46%,transparent 46%)',\n    };\n    return 'flex:none;width:'+w+'px;height:'+h+'px;border:1.5px solid #241f17;border-radius:1px;background-color:#efe9dc;background-repeat:no-repeat;background-position:center;background-size:72% 72%;background-image:'+(G[type]||'')+';';\n  }\n\n  renderVals() {\n    const { grid, sel } = this.state;\n    const filledTypes = Object.values(grid);\n    const cnt = (t)=>filledTypes.filter(x=>x===t).length;\n\n    // --- selection / glow context ---\n    const selRow = sel==null ? null : Math.floor(sel/5);\n    const role = selRow==null ? null : this.ROLES[selRow];\n    const eligTypes = role ? role.elig : [];\n    // Detail is EXPLICIT only. null = empty browse state (nothing shown until hover).\n    // Selecting a filled cell pre-loads its placed unit (see selectCell onClick); empty cell stays null.\n    const detailType = this.state.detailId;\n    const hoverType = this.state.hoverId;\n    const hasDetail = !!detailType;\n    const placedHere = sel!=null ? grid[sel] : null;\n    const detailBadge = hoverType ? 'PREVIEW · hovering'\n      : (detailType && detailType===placedHere ? 'IN THIS CELL · placed'\n      : 'PREVIEW');\n    const detailBadgeColor = (detailType && detailType===placedHere && !hoverType) ? '#2f6fd6' : '#e0a32b';\n\n    // synergy glow set = neighbors of sel that are filled & partner with hovered unit\n    const glow = new Set();\n    if (sel!=null && hoverType) {\n      const r=Math.floor(sel/5), c=sel%5;\n      const partners = this.SYN[hoverType]||[];\n      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{\n        if(rr<0||rr>4||cc<0||cc>4) return;\n        const i=rr*5+cc; const t=grid[i];\n        if(t && partners.includes(t)) glow.add(i);\n      });\n    }\n\n    // --- grid rows ---\n    const rows = this.ROLES.map((ro, r) => ({\n      label: ro.label, sub: ro.sub, accent: ro.accent,\n      cells: [0,1,2,3,4].map(c => {\n        const idx = r*5+c;\n        const type = grid[idx];\n        const filled = !!type;\n        const isSel = sel===idx;\n        const base = 'position:relative;width:64px;height:64px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;'\n          + (filled ? 'border:1.5px solid #241f17;background:#e7dfcd;' : 'border:1.5px dashed #b3a988;background:rgba(255,255,255,0.35);');\n        return {\n          filled, empty: !filled,\n          abbrev: filled ? this.CAT[type].abbrev : '',\n          symStyle: filled ? this.symStyle(type, 30, 22) : '',\n          style: base,\n          showSel: isSel, showGlow: glow.has(idx),\n          // Filled cell → show its placed unit immediately (no hover). Empty cell → blank until hover.\n          onClick: () => this.setState({ sel: idx, detailId: type || null, hoverId: null }),\n        };\n      })\n    }));\n\n    // --- overview derived values ---\n    const armorish = cnt('arm')+cnt('mech')+cnt('spg');\n    const arty = cnt('art')+cnt('spg');\n    let divType = 'Mixed Formation';\n    if (cnt('arm')>=2 && cnt('inf')+cnt('mech')>=1) divType = 'Combined-Arms Assault';\n    else if (arty>=3) divType = 'Artillery Division';\n    else if (cnt('inf')>=3) divType = 'Line Infantry';\n    else if (armorish>=3) divType = 'Armored Division';\n    const engagement = (1 + Math.min(2, cnt('recon'))) + ' tiles';\n    const heavy = cnt('arm')>0 || cnt('spg')>0;\n    const slowest = heavy ? 'Hills' : 'Forest';\n    const impassable = heavy ? 'Mountain · Dense forest' : 'Mountain';\n    const fillCount = Object.keys(grid).length;\n    const roleBalance = this.ROLES.map((ro,r)=>{\n      let c=0; for(let k=0;k<5;k++) if(grid[r*5+k]) c++;\n      return { label: ro.label, accent: ro.accent, count: c, pct: (c/5*100)+'%' };\n    });\n\n    // --- eligible list ---\n    const KEYSTATS = { recon:['Brk','Def'], mech:['Brk','Def'], arm:['Hard','Brk'], inf:['Def','Soft'], art:['Soft','Def'], at:['Hard','Def'], eng:['Def','Soft'], spg:['Soft','Brk'], hq:['Def','Soft'], aa:['Def','Hard'] };\n    const eligible = eligTypes.map(t => {\n      const u = this.CAT[t];\n      const ks = KEYSTATS[t]||['Soft','Def'];\n      return {\n        name:u.name, abbrev:u.abbrev, line:u.line,\n        symStyle: this.symStyle(t, 30, 22),\n        stat1k:ks[0], stat1v:u.stats[ks[0]], stat2k:ks[1], stat2v:u.stats[ks[1]],\n        placed: grid[sel]===t,\n        rowStyle: 'display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:3px;cursor:pointer;border:1.5px solid '\n          + (detailType===t ? '#2f6fd6;background:rgba(47,111,214,0.08);' : '#cbbfa6;background:#efe9dc;'),\n        onEnter: () => this.setState({ hoverId: t, detailId: t }),\n        onLeave: () => this.setState({ hoverId: null }),\n        onClick: () => this.setState(s => ({ grid: { ...s.grid, [s.sel]: t }, detailId: t, hoverId: null })),\n      };\n    });\n\n    // --- detail callout ---\n    let detail = { name:'—', abbrev:'', symStyle:'', line:'Hover a unit to preview', good:'—', poor:'—', syn:'—', stats:[] };\n    if (detailType) {\n      const u = this.CAT[detailType];\n      detail = {\n        name:u.name, abbrev:u.abbrev, line:u.line, good:u.good, poor:u.poor, syn:u.syn,\n        symStyle: this.symStyle(detailType, 30, 22),\n        stats: Object.keys(u.stats).map(k=>({ k, v:u.stats[k] })),\n      };\n    }\n\n    return {\n      rows,\n      cellSelected: sel!=null, showOverview: sel==null,\n      deselect: () => this.setState({ sel:null, hoverId:null }),\n      selRole: role?role.label:'', selAccent: role?role.accent:'#241f17',\n      selCoord: sel==null ? '' : ('Cell C'+((sel%5)+1)+' · '+(grid[sel]?('holds '+this.CAT[grid[sel]].abbrev):'empty')),\n      eligible, detail, hasDetail, noDetail: !hasDetail, detailBadge, detailBadgeColor,\n      divType, engagement, slowest, impassable, fillCount, roleBalance,\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
